      @font-face {

        font-weight: 100 900;
        font-style: normal;
        font-display: swap;

        --warning: #f59e0b;

        --danger: #ef4444;
        --danger-bg: #fee2e2;
        --font-display: "Satoshi", sans-serif;
        --font-body: "Satoshi", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-body);

      #root {

    </style>
